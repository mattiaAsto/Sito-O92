{% macro news_card(article) %}
  <a class="news-card" href="{{ url_for('news.detail', news_id=article.id) }}">
    <span class="news-thumb">
      {% if article.thumbnail_filename %}
        <img src="{{ url_for('news.static', filename=article.id ~ '/' ~ article.thumbnail_filename) }}" alt="" loading="lazy">
      {% else %}
        <i class="far fa-newspaper"></i>
      {% endif %}
    </span>
    <span class="news-card-body">
      <span class="news-card-title">{{ article.title }}</span>
      {% if article.summary %}<span class="news-card-summary">{{ article.summary }}</span>{% endif %}
    </span>
  </a>
{% endmacro %}
